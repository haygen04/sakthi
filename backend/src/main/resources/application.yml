server:
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: sakthi-mis-backend

  datasource:
    url: jdbc:sqlite:../mis_reporting.db
    driver-class-name: org.sqlite.JDBC

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false

jwt:
  secret: "SakthiAutomotiveManufacturingMISSecretKey2026SecureJWTTokenSignature9876543210"
  expiration-ms: 86400000 # 24 hours

pipeline:
  python-path: python
  working-dir: ..
  output-dir: ../output

